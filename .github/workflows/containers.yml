# Builds the API and migrator images and pushes them to the GitHub container registry:
#   ghcr.io/<owner>/tabletopsheets-api, ghcr.io/<owner>/tabletopsheets-migrator
# Version: major.minor from the pushed tag (v1.2.x), on manual runs from the newest v* tag, and the run number of this
# workflow as build, so every build gets a higher number. The web app shows major.minor.build (1.2.57), the assemblies
# carry major.minor.0.build (1.2.0.57; Directory.Build.props).
# Tags: <major>.<minor>.<build> (1.2.57), <major>.<minor> (1.2), latest (tags and the default branch), sha-<commit>.
# The images contain no rule data; the migrator reads it from a mounted folder (see deploy/).
name: Containers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: Api/Library/Dockerfile
          - name: migrator
            dockerfile: Seed/Dockerfile
    steps:
      # the whole history with tags, so manual runs find the newest version tag
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          fi
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)(\..*)?$ ]]; then
            echo "::error::No version tag (v<major>.<minor>…) found, got '$tag'"
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          build="${{ github.run_number }}"
          {
            echo "major=$major"
            echo "minor=$minor"
            echo "build=$build"
            echo "version=$major.$minor.$build"
          } >> "$GITHUB_OUTPUT"
          echo "Version $major.$minor.$build (from $tag, run $build)"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # image names must be lower case, the owner may not be
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tabletopsheets-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.major }}.${{ steps.version.outputs.minor }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch }}
            type=sha
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION_MAJOR=${{ steps.version.outputs.major }}
            VERSION_MINOR=${{ steps.version.outputs.minor }}
            VERSION_BUILD=${{ steps.version.outputs.build }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
