# TableTopSheets from the published images (no source, no build) with a PostgreSQL container.
# Needs only this file, a .env (see .env.example) and the seed data next to it:
#   curl -L -o dnddata.zip https://github.com/Wyrmaster/TableTopSheets/releases/latest/download/dnddata.zip
#   unzip dnddata.zip -d dnddata
#   docker compose -f compose.postgresql.yaml up -d
# the database is published on POSTGRES_PORT (default 5432) for tools like Rider or psql

name: tabletopsheets-postgresql

x-database: &database
  Database__Provider: Postgresql
  ConnectionStrings__TableTopSheets: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-tabletopsheets};Username=${POSTGRES_USER:-tabletopsheets};Password=${POSTGRES_PASSWORD:-tabletopsheets}"

services:
  # applies the schema migrations, writes the rules and images from the seed folder, then exits
  migrator:
    image: ghcr.io/wyrmaster/tabletopsheets-migrator:${TABLETOPSHEETS_VERSION:-latest}
    pull_policy: always
    command: ["migrate"]
    environment:
      <<: *database
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
    volumes:
      - ${SEED_DIR:-./dnddata}:/seed:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ghcr.io/wyrmaster/tabletopsheets-api:${TABLETOPSHEETS_VERSION:-latest}
    pull_policy: always
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-5180}:8080"
    environment:
      <<: *database
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Authentication__Provider: ${AUTH_PROVIDER:-Database}
      # at least 32 characters; the database authentication signs its tokens with it
      Authentication__Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY (at least 32 characters), e.g. in .env}
      Authentication__Database__AllowRegistration: ${ALLOW_REGISTRATION:-true}
      Authentication__Oidc__Authority: ${OIDC_AUTHORITY:-}
      Authentication__Oidc__Audience: ${OIDC_AUDIENCE:-}
    restart: unless-stopped

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tabletopsheets}
      POSTGRES_USER: ${POSTGRES_USER:-tabletopsheets}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tabletopsheets}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
